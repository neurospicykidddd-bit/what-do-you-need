# netlify build + function config.
# the spa is built by vite into dist/; functions live in netlify/functions.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# the frontend fetches /api/chat. map that to the function so the same code
# works on netlify and vercel without changing the client.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
